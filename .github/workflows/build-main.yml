name: Build Waliye Brothers APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Find and Build APK
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -1)
          echo "Gradlew found at: $GRADLEW"
          chmod +x $GRADLEW
          DIR=$(dirname $GRADLEW)
          cd $DIR
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Waliye-Brothers-APK
          path: "**/app-debug.apk"
